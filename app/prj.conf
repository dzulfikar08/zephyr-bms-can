# Kconfig for the application. Each line switches on a Zephyr subsystem or
# sets an option; the board's defaults come from nucleo_h743zi_defconfig.

# CAN driver (STM32H7 FDCAN, a Bosch M_CAN core) and its API
CONFIG_CAN=y

# Logging over the console UART (usart3 on this board)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y

# Task watchdog, falling back to the STM32 independent watchdog (IWDG)
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_CHANNELS=4

# sys_reboot() from the watchdog callback
CONFIG_REBOOT=y

# Thread names show up in logs and in the watchdog message
CONFIG_THREAD_NAME=y

# The pack model uses float; the Cortex-M7 has a hardware FPU
CONFIG_FPU=y

# Catch stack overflows in our threads (MPU guard)
CONFIG_HW_STACK_PROTECTION=y

# The hardware watchdog window is MIN_TIMEOUT + HW_FALLBACK_DELAY. The STM32
# LSI clock that drives the IWDG is only roughly 32 kHz, so leave a margin.
CONFIG_TASK_WDT_MIN_TIMEOUT=100
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=200
